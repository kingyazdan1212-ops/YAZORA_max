<style id="yazora-premium-style">
:root{
  --y-glow: rgba(99,102,241,.22);
  --y-glow2: rgba(168,85,247,.16);
  --y-radius: 20px;
}
body{
  background:
    radial-gradient(900px 500px at 8% -10%, var(--y-glow), transparent 60%),
    radial-gradient(800px 450px at 100% 5%, var(--y-glow2), transparent 58%),
    var(--bg);
  overflow-x:hidden;
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.32;
  background-image:radial-gradient(circle at 1px 1px,currentColor 1px,transparent 0);

}
.card,.tool-card,.category,.modal,.sheet,.search-box{
  border-radius:var(--y-radius)!important;
  transition:transform .24s ease,box-shadow .24s ease,border-color .24s ease,background .24s ease;
}
.card:hover,.tool-card:hover{
  transform:translateY(-5px);

  transition:transform .18s ease,filter .18s ease,box-shadow .18s ease;
}

.hero{
  position:relative;
  isolation:isolate;
}
.hero:after{
  content:"";position:absolute;width:240px;height:240px;border-radius:50%;
  right:-80px;top:-80px;background:linear-gradient(135deg,rgba(99,102,241,.18),rgba(168,85,247,.04));

.tool-card,.card{animation:ycard .55s both}
@keyframes ycard{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.lang-select{
  appearance:none;cursor:pointer;
  background:linear-gradient(135deg,var(--card),rgba(124,58,237,.06));
  box-shadow:0 5px 18px rgba(0,0,0,.06);

function applyYazoraLanguage(lang){
  const t=YAZORA_LANGS[lang]||YAZORA_LANGS.fa;
  document.documentElement.lang=lang;
  document.documentElement.dir=t.dir;
  document.title=t.title;
  const s=document.getElementById("searchInput");
  if(s) s.placeholder=t.search;
  const byId=(id)=>document.getElementById(id);
  // Update common headings when their IDs/classes are available.
  const candidates=[
    ["popularTitle",t.popular],["categoriesTitle",t.categories],["toolsTitle",t.tools]
  ];
  candidates.forEach(([id,v])=>{const e=byId(id);if(e)e.textContent=v});
  document.querySelectorAll("[data-i18n]").forEach(e=>{
    const key=e.getAttribute("data-i18n");
    if(t[key]) e.textContent=t[key];
  });
  localStorage.setItem("yazora-language",lang);
}
(function(){
  const sel=document.getElementById("languageSelect");
  if(!sel)return;
  const saved=localStorage.getItem("yazora-language")||"fa";
  sel.value=saved;
  sel.addEventListener("change",e=>applyYazoraLanguage(e.target.value));
  applyYazoraLanguage(saved);
})();
</script>

<script id="yazora-premium-js">
(function(){
  // Human-like micro-interactions: keyboard shortcut, toast, staggered cards.
  const toast = document.getElementById('yazoraToast');
  function showToast(msg){
    if(!toast)return;
    toast.textContent=msg; toast.classList.add('show');
    clearTimeout(window.__yToast);
    window.__yToast=setTimeout(()=>toast.classList.remove('show'),1800);
  }
  window.YAZORAToast=showToast;

  const cmd=document.getElementById('yazoraCommand');
  const inp=document.getElementById('yCommandInput');
  function openCmd(){if(cmd){cmd.classList.add('open');cmd.setAttribute('aria-hidden','false');setTimeout(()=>inp&&inp.focus(),50)}}
  function closeCmd(){if(cmd){cmd.classList.remove('open');cmd.setAttribute('aria-hidden','true')}}
  document.addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openCmd()}
    if(e.key==='Escape')closeCmd();
    if(e.key==='Enter' && document.activeElement===inp){
      const q=(inp.value||'').trim();
      closeCmd();
      if(q){
        const mainSearch=document.getElementById('searchInput');
        if(mainSearch){mainSearch.value=q;mainSearch.dispatchEvent(new Event('input',{bubbles:true}));mainSearch.focus()}
        showToast('جستجو انجام شد');
      }
    }
  });
  if(cmd)cmd.addEventListener('click',e=>{if(e.target===cmd)closeCmd()});

  // Reveal/stagger visible cards after initial render.
  function enhance(){
    document.querySelectorAll('.tool-card,.card').forEach((el,i)=>{
      if(!el.dataset.yEnhanced){
        el.dataset.yEnhanced='1';
        el.style.animationDelay=Math.min(i*18,360)+'ms';
        el.classList.add('yazora-reveal');
      }
    });
  }
  setTimeout(enhance,250);
  const mo=new MutationObserver(()=>enhance());
  mo.observe(document.body,{childList:true,subtree:true});

  // Small welcome toast once per browser.
  if(!localStorage.getItem('yazora-welcomed')){
    setTimeout(()=>showToast('✨ به YAZORA خوش اومدی'),900);
    localStorage.setItem('yazora-welcomed','1');
  }
})();
</script>

<script id="yazora-universal-engine">
(function(){
 const $=id=>document.getElementById(id);
 const escapeHTML=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
 const fmt=n=>Number.isFinite(n)?String(Math.round(n*1e10)/1e10):String(n);
 const templates={
  calc:{title:"ماشین حساب",html:`<input id="ytIn" class="y-tool-input" inputmode="decimal" placeholder="مثلاً 12×8+5"><div id="ytRes" class="y-result">نتیجه اینجا نمایش داده می‌شود</div><div class="y-kbd">${["7","8","9","÷","4","5","6","×","1","2","3","−","0",".","⌫","+","("," )","%","="].map((x,i)=>`<button class="${x==='='?'accent':''}" data-k="${escapeHTML(x)}">${x}</button>`).join("")}</div>`},
  percent:{title:"درصد",html:`<input id="ytA" class="y-tool-input" inputmode="decimal" placeholder="عدد"><input id="ytB" class="y-tool-input" style="margin-top:8px" inputmode="decimal" placeholder="درصد"><div id="ytRes" class="y-result"></div>`},
  bmi:{title:"BMI",html:`<input id="ytA" class="y-tool-input" inputmode="decimal" placeholder="وزن (kg)"><input id="ytB" class="y-tool-input" style="margin-top:8px" inputmode="decimal" placeholder="قد (cm)"><div id="ytRes" class="y-result"></div>`},
  text:{title:"ابزار متن",html:`<textarea id="ytText" class="y-tool-input" style="min-height:120px" placeholder="متن خود را وارد کنید..."></textarea><div class="y-tool-actions"><button data-act="upper">حروف بزرگ</button><button data-act="lower">حروف کوچک</button><button data-act="reverse">برعکس</button><button data-act="copy">کپی</button></div><div id="ytRes" class="y-result"></div>`},
  random:{title:"انتخاب تصادفی",html:`<textarea id="ytText" class="y-tool-input" style="min-height:110px" placeholder="هر گزینه در یک خط"></textarea><div class="y-tool-actions"><button data-act="random">انتخاب کن 🎲</button></div><div id="ytRes" class="y-result"></div>`},
  password:{title:"رمز تصادفی",html:`<div class="y-tool-actions"><button data-act="password">ساخت رمز قوی 🔐</button></div><div id="ytRes" class="y-result"></div>`},
  dice:{title:"تاس",html:`<div class="y-tool-actions"><button data-act="dice">انداختن تاس 🎲</button></div><div id="ytRes" class="y-result"></div>`},
  coin:{title:"شیر یا خط",html:`<div class="y-tool-actions"><button data-act="coin">پرتاب سکه 🪙</button></div><div id="ytRes" class="y-result"></div>`},
  uuid:{title:"UUID",html:`<div class="y-tool-actions"><button data-act="uuid">ساخت UUID</button></div><div id="ytRes" class="y-result"></div>`},
  base64:{title:"Base64",html:`<input id="ytText" class="y-tool-input" placeholder="متن"><div class="y-tool-actions"><button data-act="b64e">Encode</button><button data-act="b64d">Decode</button></div><div id="ytRes" class="y-result"></div>`}
 };
 function keyboard(){
  const input=$("ytIn"),res=$("ytRes"); if(!input)return;
  document.querySelectorAll(".y-kbd button").forEach(b=>b.onclick=()=>{
   const k=b.dataset.k;
   if(k==="⌫") input.value=input.value.slice(0,-1);
   else if(k==="=") calculate(input.value);
   else input.value+=k.replace("×","*").replace("÷","/").replace("−","-");
  });
  function calculate(v){
   try{
    if(!/^[0-9+*/%().\\-\\s]+$/.test(v)) throw 0;
    const x=Function('"use strict";return ('+v+')')();
    res.textContent="= "+fmt(Number(x));
   }catch{res.textContent="عبارت نامعتبر است";}
  }
  input.addEventListener("input",()=>{if(input.value)calculate(input.value)});
 }
 function mount(kind){
  const box=document.querySelector(".modal-content,.sheet-content,.modal-body,[role=dialog]");
  if(!box)return;
  const t=templates[kind]||templates.text;
  box.querySelector(".y-universal")?.remove();
  const el=document.createElement("div");el.className="y-universal";el.innerHTML=`<h3>${t.title}</h3>${t.html}`;
  box.appendChild(el);
  keyboard();
  el.addEventListener("click",e=>{
   const a=e.target.closest("[data-act]");if(!a)return;
   const act=a.dataset.act,res=$("ytRes"),txt=$("ytText")?.value||"";
   if(act==="upper")res.textContent=txt.toUpperCase();
   if(act==="lower")res.textContent=txt.toLowerCase();
   if(act==="reverse")res.textContent=[...txt].reverse().join("");
   if(act==="copy")navigator.clipboard?.writeText(txt);
   if(act==="random"){const arr=txt.split(/\n+/).map(x=>x.trim()).filter(Boolean);res.textContent=arr.length?arr[Math.floor(Math.random()*arr.length)]:"گزینه‌ای وارد نشده";}
   if(act==="password"){const c="ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%";let r="";for(let i=0;i<16;i++)r+=c[Math.floor(Math.random()*c.length)];res.textContent=r}
   if(act==="dice")res.textContent="🎲 "+(Math.floor(Math.random()*6)+1);
   if(act==="coin")res.textContent=Math.random()<.5?"شیر":"خط";
   if(act==="uuid")res.textContent=crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(16).slice(2);
   if(act==="b64e")try{res.textContent=btoa(unescape(encodeURIComponent(txt)))}catch{res.textContent="خطا"};
   if(act==="b64d")try{res.textContent=decodeURIComponent(escape(atob(txt)))}catch{res.textContent="Base64 نامعتبر است"};
  });
  const a=$("ytA"),b=$("ytB"),r=$("ytRes");
  if(kind==="percent"&&a&&b){const f=()=>{let x=+a.value,y=+b.value;r.textContent=(x&&y)?fmt(x*y/100):""};a.oninput=f;b.oninput=f}
  if(kind==="bmi"&&a&&b){const f=()=>{let w=+a.value,h=+b.value/100;r.textContent=(w&&h)?fmt(w/(h*h)):""};a.oninput=f;b.oninput=f}
 }
 window.YAZORAMountTool=mount;
 // Hook into common modal-opening patterns used by the existing app.
 const originalOpen=window.openTool;
 if(typeof originalOpen==="function"){
  window.openTool=function(tool){
   const out=originalOpen.apply(this,arguments);
   setTimeout(()=>mount(tool?.type||tool?.id||"text"),30); return out;
  };
 }
})();
</script>
